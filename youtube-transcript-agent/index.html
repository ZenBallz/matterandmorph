<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Transcript Collection Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function TranscriptAgent() {
            const [stage, setStage] = useState('setup');
            const [channelUrl, setChannelUrl] = useState('');
            const [excludeShorts, setExcludeShorts] = useState(true);
            const [maxVideos, setMaxVideos] = useState('');
            const [transcripts, setTranscripts] = useState([]);
            const [collectionLog, setCollectionLog] = useState([]);
            const [messages, setMessages] = useState([]);
            const [userInput, setUserInput] = useState('');
            const [isThinking, setIsThinking] = useState(false);
            const [progress, setProgress] = useState({ current: 0, total: 0 });

            const addLog = (message, type = 'info') => {
                setCollectionLog(prev => [...prev, { 
                    message, 
                    type, 
                    time: new Date().toLocaleTimeString() 
                }]);
            };

            const startCollection = async () => {
                if (!channelUrl.trim()) {
                    alert('Please enter a YouTube channel URL');
                    return;
                }

                setStage('collecting');
                setCollectionLog([]);
                addLog('🤖 AI Agent initialized', 'success');

                try {
                    addLog('📡 Connecting to YouTube API...', 'info');
                    
                    const discoverResponse = await fetch('http://localhost:5001/api/discover-channel', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ channel_url: channelUrl })
                    });

                    if (!discoverResponse.ok) {
                        const error = await discoverResponse.json();
                        throw new Error(error.error || 'Failed to discover channel');
                    }

                    const channelData = await discoverResponse.json();
                    addLog(`✅ Found channel: ${channelData.channel_title}`, 'success');
                    addLog(`📊 Discovered ${channelData.video_count} videos`, 'success');

                    let videoIds = channelData.video_ids;
                    
                    // Limit videos if specified
                    if (maxVideos && parseInt(maxVideos) > 0) {
                        videoIds = videoIds.slice(0, parseInt(maxVideos));
                        addLog(`🎯 Limiting to first ${videoIds.length} videos`, 'info');
                    }

                    setProgress({ current: 0, total: videoIds.length });
                    addLog('🎬 Fetching transcripts...', 'info');

                    const transcriptResponse = await fetch('http://localhost:5001/api/fetch-transcripts', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ video_ids: videoIds })
                    });

                    if (!transcriptResponse.ok) {
                        const error = await transcriptResponse.json();
                        throw new Error(error.error || 'Failed to fetch transcripts');
                    }

                    const transcriptData = await transcriptResponse.json();
                    
                    // Filter out shorts if enabled
                    let filteredTranscripts = transcriptData.transcripts;
                    if (excludeShorts) {
                        const beforeCount = filteredTranscripts.length;
                        filteredTranscripts = filteredTranscripts.filter(t => {
                            const wordCount = t.transcript.split(' ').length;
                            return wordCount > 150; // Shorts typically have very few words
                        });
                        const removedCount = beforeCount - filteredTranscripts.length;
                        if (removedCount > 0) {
                            addLog(`🎬 Filtered out ${removedCount} YouTube Shorts`, 'info');
                        }
                    }

                    addLog(`✅ Successfully collected ${filteredTranscripts.length} transcripts`, 'success');
                    
                    if (transcriptData.failed_count > 0) {
                        addLog(`⚠️  ${transcriptData.failed_count} videos had no transcripts`, 'warning');
                    }

                    setTranscripts(filteredTranscripts);
                    setProgress({ current: filteredTranscripts.length, total: videoIds.length });
                    addLog('🎉 Collection complete! Ready to chat.', 'success');

                    setTimeout(() => setStage('chat'), 2000);

                } catch (error) {
                    addLog(`❌ Error: ${error.message}`, 'error');
                    if (error.message.includes('Failed to fetch')) {
                        addLog('💡 Make sure Flask is running: python app.py', 'warning');
                    }
                }
            };

            const sendMessage = async () => {
                if (!userInput.trim() || isThinking) return;

                const newUserMessage = { role: 'user', content: userInput };
                setMessages([...messages, newUserMessage]);
                setUserInput('');
                setIsThinking(true);

                try {
                    const transcriptContext = transcripts.slice(0, 20).map(t => 
                        `VIDEO: "${t.title}" (${t.date})\nTRANSCRIPT: ${t.transcript.slice(0, 2000)}...\n---`
                    ).join('\n\n');

                    const fullContext = `You are helping someone explore ${transcripts.length} video transcripts from a YouTube channel. 

SAMPLE TRANSCRIPTS (first 20):
${transcriptContext}

USER QUESTION: ${userInput}

Provide a thoughtful response based on the transcripts. Connect ideas across videos when relevant. Be conversational and insightful.`;

                    const chatResponse = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 4000,
                            messages: [{ role: "user", content: fullContext }]
                        })
                    });

                    const chatData = await chatResponse.json();
                    const assistantMessage = {
                        role: 'assistant',
                        content: chatData.content[0].text
                    };

                    setMessages(prev => [...prev, assistantMessage]);
                } catch (error) {
                    const errorMessage = {
                        role: 'assistant',
                        content: `Error: ${error.message}`
                    };
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setIsThinking(false);
                }
            };

            const exportTranscripts = () => {
                const dataStr = JSON.stringify(transcripts, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `transcripts-${Date.now()}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 p-6">
                    <div className="max-w-5xl mx-auto">
                        
                        {stage === 'setup' && (
                            <div className="bg-white rounded-xl shadow-lg p-8">
                                <div className="mb-6">
                                    <h1 className="text-3xl font-bold text-gray-800 mb-2">
                                        YouTube Transcript Collection Agent
                                    </h1>
                                    <p className="text-gray-600">Powered by AI • Collect & Chat with Video Content</p>
                                </div>

                                <div className="bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-lg p-6 mb-6">
                                    <h3 className="font-semibold text-indigo-900 mb-3">How it works:</h3>
                                    <ol className="list-decimal list-inside space-y-2 text-indigo-800 text-sm">
                                        <li>Agent discovers all videos from the channel</li>
                                        <li>Collects transcripts from each video</li>
                                        <li>Filters out YouTube Shorts (optional)</li>
                                        <li>Chat with Claude to explore themes and insights</li>
                                    </ol>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-sm font-medium text-gray-700 mb-2">
                                            YouTube Channel URL
                                        </label>
                                        <input
                                            type="text"
                                            value={channelUrl}
                                            onChange={(e) => setChannelUrl(e.target.value)}
                                            placeholder="@ArtofAccomplishment or https://youtube.com/channel/UC..."
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Max Videos (optional)
                                            </label>
                                            <input
                                                type="number"
                                                value={maxVideos}
                                                onChange={(e) => setMaxVideos(e.target.value)}
                                                placeholder="Leave empty for all"
                                                className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            />
                                            <p className="text-xs text-gray-500 mt-1">
                                                Limit for testing (e.g., 10)
                                            </p>
                                        </div>

                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">
                                                Filter Options
                                            </label>
                                            <label className="flex items-center space-x-2 cursor-pointer bg-gray-50 px-4 py-3 rounded-lg hover:bg-gray-100">
                                                <input
                                                    type="checkbox"
                                                    checked={excludeShorts}
                                                    onChange={(e) => setExcludeShorts(e.target.checked)}
                                                    className="w-4 h-4"
                                                />
                                                <span className="text-sm text-gray-700">Exclude YouTube Shorts</span>
                                            </label>
                                        </div>
                                    </div>

                                    <button
                                        onClick={startCollection}
                                        className="w-full px-6 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg hover:from-indigo-700 hover:to-purple-700 transition-all text-lg font-semibold shadow-lg"
                                    >
                                        🚀 Start Collection Agent
                                    </button>
                                </div>
                            </div>
                        )}

                        {stage === 'collecting' && (
                            <div className="bg-white rounded-xl shadow-lg p-8">
                                <div className="mb-6">
                                    <h2 className="text-2xl font-bold text-gray-800 mb-2">Agent Working...</h2>
                                    {progress.total > 0 && (
                                        <div className="mt-4">
                                            <div className="flex justify-between text-sm text-gray-600 mb-2">
                                                <span>Progress</span>
                                                <span>{progress.current} / {progress.total}</span>
                                            </div>
                                            <div className="w-full bg-gray-200 rounded-full h-3">
                                                <div 
                                                    className="bg-indigo-600 h-3 rounded-full transition-all"
                                                    style={{ width: `${(progress.current / progress.total) * 100}%` }}
                                                />
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-gray-50 rounded-lg p-4 mb-6 max-h-64 overflow-y-auto font-mono text-sm space-y-1">
                                    {collectionLog.map((log, idx) => (
                                        <div key={idx} className={`flex items-start gap-2 ${
                                            log.type === 'error' ? 'text-red-600' :
                                            log.type === 'success' ? 'text-green-600' :
                                            log.type === 'warning' ? 'text-yellow-600' :
                                            'text-gray-700'
                                        }`}>
                                            <span className="text-gray-400 text-xs">{log.time}</span>
                                            <span>{log.message}</span>
                                        </div>
                                    ))}
                                </div>

                                {transcripts.length > 0 && (
                                    <div>
                                        <h3 className="font-semibold text-gray-800 mb-3">
                                            Collected: {transcripts.length} transcripts
                                        </h3>
                                        <div className="space-y-2 max-h-48 overflow-y-auto">
                                            {transcripts.slice(0, 10).map(t => (
                                                <div key={t.id} className="bg-green-50 rounded-lg p-3 text-sm">
                                                    <div className="font-medium text-green-900">{t.title}</div>
                                                    <div className="text-green-600 text-xs">{t.date}</div>
                                                </div>
                                            ))}
                                            {transcripts.length > 10 && (
                                                <div className="text-center text-gray-500 text-sm py-2">
                                                    ... and {transcripts.length - 10} more
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {stage === 'chat' && (
                            <div className="space-y-4">
                                <div className="bg-white rounded-xl shadow-lg p-6">
                                    <div className="flex items-center justify-between mb-4">
                                        <div>
                                            <h2 className="text-2xl font-bold text-gray-800">Chat with Your Content</h2>
                                            <p className="text-sm text-gray-600">{transcripts.length} videos ready</p>
                                        </div>
                                        <div className="flex gap-2">
                                            <button
                                                onClick={exportTranscripts}
                                                className="px-4 py-2 text-sm bg-green-600 text-white rounded-lg hover:bg-green-700"
                                            >
                                                💾 Export
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setStage('setup');
                                                    setTranscripts([]);
                                                    setMessages([]);
                                                }}
                                                className="px-4 py-2 text-indigo-600 hover:bg-indigo-50 rounded-lg text-sm"
                                            >
                                                New Collection
                                            </button>
                                        </div>
                                    </div>

                                    <div className="bg-gradient-to-r from-purple-50 to-pink-50 rounded-lg p-4">
                                        <p className="text-sm text-purple-900 font-medium mb-2">💡 Try asking:</p>
                                        <ul className="text-sm text-purple-700 space-y-1">
                                            <li>• "What are the main themes across these videos?"</li>
                                            <li>• "Summarize key insights about [topic]"</li>
                                            <li>• "What practical advice is given?"</li>
                                        </ul>
                                    </div>
                                </div>

                                <div className="space-y-4 max-h-96 overflow-y-auto">
                                    {messages.map((msg, idx) => (
                                        <div
                                            key={idx}
                                            className={`p-4 rounded-lg ${
                                                msg.role === 'user'
                                                    ? 'bg-indigo-600 text-white ml-12'
                                                    : 'bg-white shadow-lg mr-12'
                                            }`}
                                        >
                                            <div className="text-sm font-semibold mb-1">
                                                {msg.role === 'user' ? 'You' : 'Claude'}
                                            </div>
                                            <div className="whitespace-pre-wrap">{msg.content}</div>
                                        </div>
                                    ))}
                                    {isThinking && (
                                        <div className="bg-white shadow-lg p-4 rounded-lg mr-12">
                                            <div className="flex items-center gap-2 text-gray-600">
                                                <div className="animate-spin">⏳</div>
                                                <span>Claude is thinking...</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="bg-white rounded-xl shadow-lg p-4">
                                    <div className="flex gap-3">
                                        <input
                                            type="text"
                                            value={userInput}
                                            onChange={(e) => setUserInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                            placeholder="Ask about the content..."
                                            className="flex-1 px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                            disabled={isThinking}
                                        />
                                        <button
                                            onClick={sendMessage}
                                            disabled={isThinking || !userInput.trim()}
                                            className="px-6 py-3 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-gray-400 transition-colors font-medium"
                                        >
                                            Send
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<TranscriptAgent />, document.getElementById('root'));
    </script>
</body>
</html>
